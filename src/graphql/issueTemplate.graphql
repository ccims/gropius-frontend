fragment DefaultIssueTemplateInfo on IssueTemplate {
    id
    name
    description
    templateFieldSpecifications {
        name
        value
    }
}

# the entries a created template can inherit, for the extended templates of the create dialog
fragment IssueTemplateFields on IssueTemplate {
    id
    name
    issueTypes {
        nodes {
            name
            description
            iconPath
        }
    }
    issuePriorities {
        nodes {
            name
            description
            value
            iconPath
        }
    }
    issueStates {
        nodes {
            name
            description
            isOpen
        }
    }
    assignmentTypes {
        nodes {
            name
            description
        }
    }
    relationTypes {
        nodes {
            name
            description
            inverseName
        }
    }
}
